<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <style id="trava-tela">
      html { display: none !important; }
  </style>
  <script>
      if (!sessionStorage.getItem("usuarioLogado")) {
          window.location.replace("index.html");
      } else {
          document.getElementById("trava-tela").remove();
      }
      window.logoutUsuario = function() {
          sessionStorage.clear();
          window.location.replace("index.html");
      };
      window.sairDoSistema = window.logoutUsuario;
      
      window.addEventListener("pageshow", function(event) {
          if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
              if (!sessionStorage.getItem("usuarioLogado")) window.location.replace("index.html");
          }
      });
  </script>
  <meta charset="UTF-8" />
  <title>Todos os Produtos</title>
  <link rel="icon" href="icon.ico" type="image/x-icon">
  <link rel="stylesheet" href="todos-produtos.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module" src="firebase-banco.js"></script>
</head>
<body>
  <div class="container">
    <h2>Todos os Produtos</h2>
    <div class="header-actions">
      <button onclick="window.location.href='sistema.html'">Voltar</button>
      <div class="botoes-container">
        <button id="btnImprimirCompleto">Imprimir Relatório Completo</button>
        <button id="btnSalvarPDF">Salvar como PDF</button>
      </div>
    </div>
    
    <input type="text" id="filtroTodosInput" placeholder="Filtrar por nome ou código..." class="filter-input" />
    
    <div class="table-container">
      <table id="todos-produtos-table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nome do Produto</th>
            <th>Quantidade</th>
            <th>Valor Unitário</th>
            <th>Valor Total</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr>
            <td colspan="4" class="total-label">Valor Total do Estoque:</td>
            <td id="total-estoque-geral" class="total-value">R$ 0,00</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function atualizarTabelaCompleta() {
      var produtos = window.obterDados ? window.obterDados("produtos") : {};
      if (!produtos) return;

      var filtroInput = document.getElementById("filtroTodosInput");
      var tbody = document.querySelector("#todos-produtos-table tbody");
      var totalElement = document.getElementById("total-estoque-geral");

      var filtro = filtroInput.value.toLowerCase().trim();
      var total = 0;

      var chaves = Object.keys(produtos);
      var filtrados = [];
      for (var i = 0; i < chaves.length; i++) {
          var codigo = chaves[i];
          var p = produtos[codigo];
          if (codigo.toLowerCase().includes(filtro) || p.nome.toLowerCase().includes(filtro)) {
              filtrados.push({ codigo: codigo, p: p });
          }
      }

      tbody.innerHTML = "";
      if (filtrados.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>Nenhum produto encontrado.</td></tr>";
        totalElement.innerText = "R$ 0,00";
        return;
      }

      filtrados.forEach(function(item) {
        var codigo = item.codigo;
        var p = item.p;
        var valorTotal = p.quantidade * p.valor;
        total += valorTotal;
        
        var tr = document.createElement("tr");
        tr.innerHTML = "<td data-label='Código:'>" + codigo + "</td>" +
                       "<td data-label='Nome:'>" + p.nome + "</td>" +
                       "<td data-label='Quantidade:'>" + p.quantidade + "</td>" +
                       "<td data-label='Valor Unitário:'>R$ " + p.valor.toFixed(2) + "</td>" +
                       "<td data-label='Valor Total Produto:'>R$ " + valorTotal.toFixed(2) + "</td>";
        tbody.appendChild(tr);
      });
      
      totalElement.innerText = "R$ " + total.toFixed(2);
    }

    document.addEventListener("dadosAtualizados", atualizarTabelaCompleta);
    document.addEventListener("bancoPronto", atualizarTabelaCompleta);
    
    var inputFiltro = document.getElementById("filtroTodosInput");
    if (inputFiltro) {
        inputFiltro.addEventListener("input", atualizarTabelaCompleta);
    }

    if (window.isBancoPronto) {
        atualizarTabelaCompleta();
    }

    var btnPdf = document.getElementById("btnSalvarPDF");
    if (btnPdf) {
      btnPdf.addEventListener("click", function() {
        var element = document.querySelector(".container");
        var dataLocal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
        var dataFormatada = dataLocal.toISOString().split("T")[0];

        var opt = {
          margin: 10,
          filename: "todos_produtos_" + dataFormatada + ".pdf",
          html2canvas: { scale: 2 },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
        };
        html2pdf().set(opt).from(element).save();
      });
    }

    var btnImprimir = document.getElementById("btnImprimirCompleto");
    if (btnImprimir) {
      btnImprimir.addEventListener("click", function() {
        var container = document.querySelector(".container");
        if (!container) return;

        var clone = container.cloneNode(true);
        var elementosParaRemover = clone.querySelectorAll("button, input, select, .quick-action-buttons");
        elementosParaRemover.forEach(function(el) { el.remove(); });

        var style = document.createElement("style");
        style.textContent = "body, html { margin:0; padding:0; font-family: Arial, sans-serif; } " +
                            ".container { width: 100% !important; max-width: none !important; padding: 1.5cm !important; box-sizing: border-box; } " +
                            "table { width: 100% !important; border-collapse: collapse !important; margin-top: 20px; table-layout: auto !important; } " +
                            "th, td { border: 1px solid #000 !important; padding: 10px 8px !important; text-align: left; font-size: 11pt !important; word-wrap: break-word; } " +
                            "th { background-color: #f0f0f0 !important; font-weight: bold; text-align: center; } " +
                            "h1, h2, h3 { text-align: center; margin: 0.5cm 0; page-break-after: avoid; } " +
                            "@page { margin: 1cm; size: A4; }";

        var iframe = document.createElement("iframe");
        iframe.style.display = "none";
        document.body.appendChild(iframe);

        var doc = iframe.contentWindow.document;
        doc.head.appendChild(style);
        doc.body.appendChild(clone);

        setTimeout(function() {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
          setTimeout(function() { document.body.removeChild(iframe); }, 1000);
        }, 500);
      });
    }
  </script>
</body>
</html>
